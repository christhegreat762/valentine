<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine 💘</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
    }

    button {
      padding: 12px 24px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: white;
      color: #ff4d6d;
    }
  </style>
</head>
<body>

  <h1>Will you be my Valentine? 💕</h1>

  <div>
    <button class="yes" onclick="alert('YAY!!! 💖💖💖')">Yes 💘</button>
    <button class="no" onclick="alert('Too bad, you’re mine 😌')">No 😅</button>
  </div>

</body>
</html>
